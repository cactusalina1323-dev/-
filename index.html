<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1ed"><meta name="description" content="Мой план — личный планировщик"><link rel="manifest" href="manifest.json"><title>Мой план</title>
<style>
:root{--bg:#f8f4f1;--card:#fffdfb;--ink:#302e2c;--muted:#817a76;--line:#ece3de;--rose:#e8b9b5;--rose2:#f5e1de;--green:#5b927d;--green2:#e1eee7;--gold:#d7ae75;--shadow:0 8px 28px #6c4b3a0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#f8f4f1ed;backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid #ece3de80}.head,main{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:39px;height:39px;border-radius:14px;background:var(--rose2);display:grid;place-items:center;font-size:22px}.brand h1{font-size:19px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.headactions{display:flex;gap:7px}.headbtn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 10px;color:var(--muted)}main{padding:17px 15px 24px}.greeting{margin:5px 2px 18px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.06em}.greeting h2{font-size:26px;line-height:1.15;margin:6px 0}.greeting p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:17px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}.stat .n{font-size:21px;font-weight:700}.stat .l{font-size:10px;color:var(--muted);margin-top:4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:21px 2px 10px}.sectionhead h3{margin:0;font-size:16px}.linkbtn{border:0;background:transparent;color:var(--green);font-size:12px;padding:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.iconbox{width:40px;height:40px;border-radius:13px;background:var(--rose2);display:grid;place-items:center;font-size:19px;flex-shrink:0}.card h4{margin:0 0 4px;font-size:14px}.sub{color:var(--muted);font-size:12px}.progress{height:6px;background:#eee7e2;border-radius:10px;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--green);border-radius:10px}.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #f0e9e5}.task:last-child{border:0}.task.done .taskname{text-decoration:line-through;color:#9b9692}.taskname{font-size:14px}.tasktime{font-size:11px;color:var(--muted);margin-top:3px}.check{width:22px;height:22px;accent-color:var(--green);flex-shrink:0;margin-top:1px}.primary{border:0;background:var(--green);color:white;border-radius:13px;padding:11px 15px;font-weight:600}.secondary{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;color:var(--ink)}.addwide{width:100%;border:1px dashed #d8c9c1;background:#fffaf7;color:#6f887d;border-radius:14px;padding:12px;margin:4px 0 12px}.pills{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 12px;color:var(--muted);font-size:12px}.pill.active{background:var(--green2);border-color:#c9dfd3;color:#396e5a}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fffdfb;color:var(--ink);outline-color:var(--green)}.field textarea{min-height:100px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:13px}.money{font-size:23px;font-weight:700}.positive{color:var(--green)}.negative{color:#c06e69}.habitdays{display:flex;gap:5px;margin-top:11px}.daydot{flex:1;border:0;border-radius:9px;padding:7px 0;background:#f1ece8;color:#9b938e;font-size:10px}.daydot.yes{background:var(--green2);color:#39715b}.daydot.today{outline:1px solid var(--green)}.flame{font-size:21px;filter:grayscale(1);opacity:.38;transition:.25s}.flame.on{filter:none;opacity:1;animation:ignite .35s ease}@keyframes ignite{0%{transform:scale(.6)}70%{transform:scale(1.25)}100%{transform:scale(1)}}nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fffdfbf0;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{display:flex;width:min(760px,100%);justify-content:space-around}.navbtn{border:0;background:transparent;color:#8c8580;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;font-size:10px;min-width:48px}.navbtn .ico{font-size:19px}.navbtn.active{color:var(--green);font-weight:700}.modalback{position:fixed;inset:0;z-index:20;background:#302e2c66;display:none;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:var(--bg);border-radius:23px 23px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));width:min(760px,100%);max-height:91vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0;font-size:18px}.close{border:0;background:var(--rose2);border-radius:50%;width:33px;height:33px;font-size:19px}.notice{background:#f5e9d9;border-radius:13px;padding:11px;font-size:12px;color:#735c43;line-height:1.45;margin-bottom:11px}.smallbtn{border:0;background:transparent;color:#a36d68;padding:5px;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;color:var(--muted);font-size:10px;padding:5px 0}.calday{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:48px;padding:5px 3px;text-align:left;font-size:12px;position:relative;color:var(--ink)}.calday.muted{opacity:.35}.calday.selected{outline:2px solid var(--green);outline-offset:1px}.calday .mark{display:block;width:8px;height:8px;border-radius:50%;margin-top:5px}.calday .tiny{font-size:9px;color:var(--muted)}.colorrow{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:31px;height:31px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--line)}.swatch.active{box-shadow:0 0 0 2px var(--green)}.menugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.menuitem{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;text-align:left}.menuitem span{display:block;font-size:20px;margin-bottom:6px}.muted{color:var(--muted)}.inline-note{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:7px}.goalitem{border-left:3px solid var(--green);padding-left:10px;margin:9px 0}.tag{font-size:10px;border-radius:20px;padding:4px 8px;background:var(--green2);color:#396e5a}.hidden{display:none!important}
@media(min-width:620px){main{padding:23px}.modalback{align-items:center}.modal{border-radius:23px}.stats{gap:12px}.stat{padding:15px}}
</style></head><body>
<header><div class="head"><div class="brand"><div class="logo">🌵</div><div><h1>Мой план</h1><p>Твой план — твоя свобода</p></div></div><div class="headactions"><button class="headbtn" onclick="openMenu()">☰</button><button class="headbtn" onclick="openSettings()">⚙</button></div></div></header><main id="app"></main>
<nav><div class="navinner" id="nav"></div></nav><div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const KEY='moyPlanDataV2';const old=localStorage.getItem('moy-plan-v1');let data=load();let page='home',taskFilter='today',financeTab='transactions',calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDates=[],selectMode=false,selectedColor='#d8e9df',calendarTouch=null;
function fresh(){return {goals:[],habits:[],tasks:[],transactions:[],debts:[],savings:[],calendarMarks:{},diary:[],events:[],settings:{}}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return {...fresh(),...x}}catch(e){}try{let x=old?JSON.parse(old):null;if(x){let n={...fresh(),...x};n.goals=(n.goals||[]).map(g=>({...g,progress:g.progress??0,subgoals:(g.subgoals||g.subs||g.steps||[]).map(s=>typeof s==='string'?{id:id(),title:s,progress:0,links:[]}:({...s,id:s.id||id(),links:s.links||[],progress:s.progress||0}))}));n.habits=(n.habits||[]).map(h=>({...h,schedule:h.schedule||[1,2,3,4,5,6,0]}));n.tasks=(n.tasks||[]).map(t=>({...t,note:t.note||'',goalId:t.goalId||'',subgoalId:t.subgoalId||''}));return n}}catch(e){}return fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function id(){return Math.random().toString(36).slice(2,10)}function today(){return fmtDate(new Date())}function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽'}function pct(a,b){return b?Math.max(0,Math.min(100,Math.round(a/b*100))):0}function dateFmt(s){if(!s)return '';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}function goalName(id){return data.goals.find(g=>g.id===id)?.title||''}function subName(gid,sid){let g=data.goals.find(g=>g.id===gid);return g?.subgoals?.find(s=>s.id===sid)?.title||''}function linkOptions(selectedGoal='',selectedSub=''){return `<option value="">Без привязки</option>`+data.goals.map(g=>`<optgroup label="${esc(g.title)}"><option value="${g.id}" ${selectedGoal===g.id&&!selectedSub?'selected':''}>Цель: ${esc(g.title)}</option>${(g.subgoals||[]).map(s=>`<option value="${g.id}::${s.id}" ${selectedGoal===g.id&&selectedSub===s.id?'selected':''}>↳ ${esc(s.title)}</option>`).join('')}</optgroup>`).join('')}
function navRender(){let items=[['home','⌂','Главная'],['tasks','☷','Задачи'],['habits','♨','Привычки'],['calendar','▦','Календарь'],['finance','₽','Финансы'],['ai','✧','AI']];document.getElementById('nav').innerHTML=items.map(([k,i,t])=>`<button class="navbtn ${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join('')}
function go(p){page=p;render()}function render(){navRender();let el=document.getElementById('app');el.innerHTML=({home:homeView,tasks:tasksView,habits:habitsView,calendar:calendarView,finance:financeView,ai:aiView,diary:diaryView,analytics:analyticsView}[page]||homeView)()}
function head(eyebrow,title,desc=''){return `<div class="greeting"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div>`}function stat(n,l){return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`}function section(t,action='',fn=''){return `<div class="sectionhead"><h3>${t}</h3>${action?`<button class="linkbtn" onclick="${fn}">${action}</button>`:''}</div>`}
function taskRow(t){let sub=t.subgoalId?subName(t.goalId,t.subgoalId):goalName(t.goalId);return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow" onclick="editTask('${t.id}')"><div class="taskname">${esc(t.title)}</div><div class="tasktime">${dateFmt(t.date)} ${t.time||''}${sub?' · '+esc(sub):''}</div>${t.note?`<div class="inline-note">${esc(t.note.slice(0,110))}${t.note.length>110?'…':''}</div>`:''}</div><button class="smallbtn" onclick="editTask('${t.id}')">•••</button></div>`}
function homeView(){let ts=data.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,hs=data.habits.filter(h=>(h.schedule||[]).includes(new Date().getDay())),hd=hs.filter(h=>h.logs?.[today()]).length,active=data.goals.filter(g=>!g.archived);return `${head(new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}).toUpperCase(),'Твой день 🌷','Небольшие шаги тоже ведут к большим переменам.') }<div class="stats">${stat(ts.length,`Задач сегодня`)}${stat(`${hd}/${hs.length}`,`Привычки`)}${stat(active.length,`Активные цели`)}</div>${section('Задачи на сегодня','Все задачи','go(\'tasks\')')}<div class="card">${ts.length?ts.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(taskRow).join(''):'<div class="empty">На сегодня задач пока нет 🌿</div>'}<button class="addwide" onclick="taskForm()">＋ Добавить задачу</button></div>${tomorrowBlock()}${section('Привычки','Все привычки','go(\'habits\')')}<div class="card">${hs.length?hs.map(h=>habitHomeRow(h)).join(''):'<div class="empty">На сегодня привычек по расписанию нет.</div>'}</div>${section('Мои цели','Управлять','go(\'home\');openGoals()')}<div>${active.map(g=>`<div class="card" onclick="goalDetails('${g.id}')"><div class="row"><div class="iconbox">🎯</div><div class="grow"><h4>${esc(g.title)}</h4><div class="sub">${(g.subgoals||[]).length} подцелей</div></div><b>${Number(g.progress)||0}%</b></div><div class="progress"><span style="width:${Number(g.progress)||0}%"></span></div></div>`).join('')||'<div class="empty">Добавь первую большую цель.</div>'}<button class="addwide" onclick="goalForm()">＋ Добавить цель</button></div><div class="row" style="justify-content:space-around;margin:18px 0 4px"><button class="secondary" onclick="go('diary')">📖 Дневник</button><button class="secondary" onclick="go('analytics')">▥ Аналитика</button><button class="secondary" onclick="openMenu()">••• Ещё</button></div>`}
function tomorrowBlock(){let d=new Date();d.setDate(d.getDate()+1);let key=fmtDate(d),arr=data.tasks.filter(t=>t.date===key);if(!arr.length)return '';return `${section('Завтра',`${arr.length} задач`,'go(\'tasks\')')}<div class="card">${arr.slice(0,2).map(t=>`<div class="task"><div class="grow"><div class="taskname">${esc(t.title)}</div><div class="tasktime">${t.time||'Без времени'}</div></div></div>`).join('')}${arr.length>2?`<button class="linkbtn" onclick="go('tasks')">Ещё ${arr.length-2}…</button>`:''}</div>`}
function habitHomeRow(h){let yes=!!h.logs?.[today()];return `<div class="task"><span class="flame ${yes?'on':''}">🔥</span><div class="grow"><div class="taskname">${esc(h.title)}</div><div class="tasktime">Серия: ${streak(h)} дн.</div></div><button class="secondary" onclick="habitToggle('${h.id}','${today()}')">${yes?'Отменить':'Выполнено'}</button></div>`}function streak(h){let n=0,d=new Date();for(let i=0;i<366;i++){let s=fmtDate(d);if(h.logs?.[s])n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function tasksView(){let tasks=data.tasks.filter(t=>taskFilter==='all'||(taskFilter==='today'?t.date===today():taskFilter==='upcoming'?t.date>today():t.date===calendarDate)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));return `${head('ТВОЙ СПОКОЙНЫЙ ПЛАН','Задачи','Все дела, заметки и следующие шаги.') }<button class="addwide" onclick="taskForm()">＋ Добавить задачу</button><div class="pills">${[['today','Сегодня'],['upcoming','Предстоящие'],['all','Все задачи'],['date','По дате']].map(([k,v])=>`<button class="pill ${taskFilter===k?'active':''}" onclick="taskFilter='${k}';render()">${v}</button>`).join('')}</div>${taskFilter==='date'?`<div class="field"><label>Выбери дату</label><input type="date" value="${calendarDate||today()}" onchange="calendarDate=this.value;render()"></div>`:''}<div class="card">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">Задач не найдено. Можно выдохнуть 🌿</div>'}</div>`}let calendarDate=today();
function taskForm(item=null){let t=item||{};openModal(`<div class="modalhead"><h3>${item?'Редактировать задачу':'Новая задача'}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveTask(event,'${t.id||''}')"><div class="field"><label>Название</label><input name="title" required maxlength="140" value="${esc(t.title||'')}" placeholder="Что нужно сделать?"></div><div class="formgrid"><div class="field"><label>Дата</label><input name="date" type="date" required value="${t.date||today()}"></div><div class="field"><label>Время</label><input name="time" type="time" value="${t.time||''}"></div><div class="field full"><label>Связать с целью или подцелью</label><select name="link">${linkOptions(t.goalId,t.subgoalId)}</select></div><div class="field full"><label>Заметка / подробное описание</label><textarea name="note" placeholder="Подробности, список шагов, ссылки, мысли…">${esc(t.note||'')}</textarea></div></div><button class="primary" style="width:100%">Сохранить задачу</button>${item?`<button type="button" class="smallbtn" onclick="deleteTask('${item.id}')">Удалить задачу</button>`:''}</form>`)}function saveTask(e,tid){let f=new FormData(e.target),link=String(f.get('link')||'').split('::'),t={id:tid||id(),title:f.get('title'),date:f.get('date'),time:f.get('time'),note:f.get('note'),goalId:link[0]||'',subgoalId:link[1]||'',done:false};let oldt=data.tasks.find(x=>x.id===tid);if(oldt)t.done=oldt.done;let i=data.tasks.findIndex(x=>x.id===tid);if(i>=0)data.tasks[i]=t;else data.tasks.push(t);closeModal();save()}function editTask(tid){let t=data.tasks.find(x=>x.id===tid);if(t)taskForm(t)}function toggleTask(tid){let t=data.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;save()}}function deleteTask(tid){if(confirm('Удалить задачу?')){data.tasks=data.tasks.filter(t=>t.id!==tid);closeModal();save()}}
function habitsView(){return `${head('МАЛЕНЬКИЕ ШАГИ','Привычки 🔥','Твой ритм — твои правила.') }<button class="addwide" onclick="habitForm()">＋ Добавить привычку</button>${data.habits.map(h=>`<div class="card"><div class="row"><div class="iconbox">${esc(h.emoji||'🔥')}</div><div class="grow"><h4>${esc(h.title)}</h4><div class="sub">${(h.schedule||[]).length===7?'Каждый день':'Гибкое расписание'} · серия ${streak(h)} дн.</div></div><button class="smallbtn" onclick="habitForm('${h.id}')">Изменить</button></div><div class="habitdays">${weekDates().map(d=>`<button class="daydot ${h.logs?.[d]?'yes ':''}${d===today()?'today':''}" onclick="habitToggle('${h.id}','${d}')">${new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'})}<br>${d.slice(-2)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">Добавь привычку, которую хочешь закрепить.</div>'}`}
function weekDates(){let a=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(fmtDate(d))}return a}function habitForm(hid=''){let h=data.habits.find(x=>x.id===hid)||{};openModal(`<div class="modalhead"><h3>${hid?'Настроить привычку':'Новая привычка'}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveHabit(event,'${hid}')"><div class="field"><label>Название</label><input name="title" required value="${esc(h.title||'')}"></div><div class="field"><label>Эмодзи</label><input name="emoji" value="${esc(h.emoji||'🔥')}" maxlength="4"></div><div class="field"><label>Дни выполнения</label><div class="pills">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<label class="pill"><input type="checkbox" name="days" value="${(i+1)%7}" ${(h.schedule||[1,2,3,4,5,6,0]).includes((i+1)%7)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="field"><label>Связать с подцелью</label><select name="link">${linkOptions(h.goalId,h.subgoalId)}</select></div><button class="primary" style="width:100%">Сохранить</button>${hid?`<button type="button" class="smallbtn" onclick="deleteHabit('${hid}')">Удалить привычку</button>`:''}</form>`)}function saveHabit(e,hid){let f=new FormData(e.target),l=String(f.get('link')||'').split('::'),h={id:hid||id(),title:f.get('title'),emoji:f.get('emoji')||'🔥',schedule:f.getAll('days').map(Number),logs:data.habits.find(x=>x.id===hid)?.logs||{},goalId:l[0]||'',subgoalId:l[1]||''};let i=data.habits.findIndex(x=>x.id===hid);if(i>=0)data.habits[i]=h;else data.habits.push(h);closeModal();save()}function habitToggle(hid,d){let h=data.habits.find(x=>x.id===hid);if(h){h.logs=h.logs||{};h.logs[d]=!h.logs[d];if(!h.logs[d])delete h.logs[d];save()}}function deleteHabit(hid){if(confirm('Удалить привычку?')){data.habits=data.habits.filter(h=>h.id!==hid);closeModal();save()}}
function calendarView(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let n=1;n<=last;n++){let d=fmtDate(new Date(y,m,n)),mark=data.calendarMarks[d],tasks=data.tasks.filter(t=>t.date===d).length,ev=data.events.filter(e=>e.date===d).length;cells+=`<button class="calday ${selectedDates.includes(d)?'selected':''}" data-date="${d}" style="${mark?`background:${mark.color}55;border-color:${mark.color}`:''}" onclick="calendarTap('${d}')" oncontextmenu="event.preventDefault();calendarLong('${d}')" ontouchstart="calendarTouchStart('${d}')" ontouchend="calendarTouchEnd()" ontouchmove="calendarTouchEnd()"><span>${n}</span>${tasks||ev?`<span class="tiny">${tasks?tasks+' з. ':''}${ev?ev+' с.':''}</span>`:''}${mark?`<span class="tiny">${esc(mark.label||'')}</span>`:''}</button>`}let labels=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];return `${head('ТВОЁ ВРЕМЯ','Календарь','Планируй дела, смены, выходные и важные даты.') }<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><button class="secondary" onclick="monthShift(-1)">‹</button><b>${calMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="secondary" onclick="monthShift(1)">›</button></div><div class="calendar">${labels.map(x=>`<div class="calhead">${x}</div>`).join('')}${cells}</div><div class="sub" style="margin-top:12px">Нажми на день, чтобы выбрать его. Зажми день, чтобы перейти к выделению нескольких дат и раскраске.</div></div>${selectedDates.length?`<div class="card"><div class="row" style="justify-content:space-between"><b>Выбрано: ${selectedDates.length}</b><button class="smallbtn" onclick="selectedDates=[];render()">Снять выделение</button></div><div class="colorrow" style="margin:12px 0">${['#d8e9df','#f2d6d4','#f4e5bd','#d9e3f3','#e6d8ed','#ead9c9'].map(c=>`<button class="swatch ${selectedColor===c?'active':''}" style="background:${c}" onclick="selectedColor='${c}';applyCalendarColor()"></button>`).join('')}</div><div class="field"><label>Название отметки (необязательно)</label><input id="markLabel" placeholder="Например, смена, отпуск, выходной"></div><button class="primary" style="width:100%" onclick="applyCalendarColor()">Применить цвет к выбранным датам</button><button class="secondary" style="width:100%;margin-top:7px" onclick="calendarEventForm()">＋ Добавить событие на выбранные даты</button></div>`:''}<div class="card"><b>События и задачи на выбранный день</b>${selectedDates.length===1?calendarDayDetails(selectedDates[0]):'<p class="sub">Выбери один день, чтобы посмотреть его задачи и события.</p>'}</div>`}
function monthShift(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);selectedDates=[];render()}function calendarTap(d){if(selectMode){if(!selectedDates.includes(d))selectedDates.push(d)}else selectedDates=selectedDates.includes(d)?[]:[d];render()}let holdTimer=null;function calendarTouchStart(d){selectMode=false;holdTimer=setTimeout(()=>{selectMode=true;if(!selectedDates.includes(d))selectedDates=[d];render()},550)}function calendarTouchEnd(){clearTimeout(holdTimer)}function calendarLong(d){selectMode=true;if(!selectedDates.includes(d))selectedDates=[d];render()}function applyCalendarColor(){let label=document.getElementById('markLabel')?.value||'';selectedDates.forEach(d=>{data.calendarMarks[d]={color:selectedColor,label}});selectMode=false;save()}function calendarDayDetails(d){let ts=data.tasks.filter(t=>t.date===d),ev=data.events.filter(e=>e.date===d);return `<div style="margin-top:8px">${ts.map(t=>`<div class="task"><span>${t.done?'✓':'○'}</span><div class="grow"><div class="taskname">${esc(t.title)}</div><div class="tasktime">Задача ${t.time||''}</div></div></div>`).join('')}${ev.map(e=>`<div class="task"><span>◷</span><div class="grow"><div class="taskname">${esc(e.title)}</div><div class="tasktime">${esc(e.kind||'Событие')}</div></div></div>`).join('')||''}${!ts.length&&!ev.length?'<p class="sub">Пока ничего не запланировано.</p>':''}<button class="linkbtn" onclick="taskFormForDate('${d}')">＋ Задача на этот день</button></div>`}function taskFormForDate(d){taskForm();setTimeout(()=>{let x=document.querySelector('#modal input[name=date]');if(x)x.value=d},0)}function calendarEventForm(){let dates=[...selectedDates].sort();openModal(`<div class="modalhead"><h3>Новое событие</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target);let title=f.get('title'),kind=f.get('kind');selectedDates.forEach(d=>data.events.push({id:id(),title,kind,date:d}));closeModal();save()"><div class="field"><label>Название</label><input name="title" required placeholder="Например, рабочая смена"></div><div class="field"><label>Тип</label><select name="kind"><option>Рабочая смена</option><option>Выходной</option><option>Отпуск</option><option>Личное событие</option><option>Другое</option></select></div><p class="sub">Событие будет добавлено на ${dates.length} выбранных дат.</p><button class="primary" style="width:100%">Сохранить событие</button></form>`)}
function financeView(){let income=data.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),expenses=data.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0),debt=data.debts.reduce((s,d)=>s+Number(d.balance??d.amount),0),saved=data.savings.reduce((s,x)=>s+Number(x.current),0);let inner='';if(financeTab==='transactions')inner=`<button class="addwide" onclick="transactionForm()">＋ Добавить операцию</button><div class="card">${data.transactions.map(t=>`<div class="task"><div class="grow"><div class="taskname">${esc(t.title)}</div><div class="tasktime">${dateFmt(t.date)} · ${t.category||'Без категории'}</div></div><strong class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</strong><button class="smallbtn" onclick="removeItem('transactions','${t.id}')">×</button></div>`).join('')||'<div class="empty">Добавь первую операцию.</div>'}</div>`;if(financeTab==='debts')inner=`<button class="addwide" onclick="debtForm()">＋ Добавить долг</button>${data.debts.map(d=>`<div class="card"><div class="row"><div class="iconbox">💳</div><div class="grow"><h4>${esc(d.title)}</h4><div class="sub">Ставка: ${d.rate||0}% · ${d.payment?`Платёж ${fmt(d.payment)}`:'Платёж не задан'}</div></div><b>${fmt(d.balance??d.amount)}</b></div><div class="progress"><span style="width:${pct(d.original-(d.balance??d.amount),d.original||d.amount)}%"></span></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="sub">Остаток долга</span><button class="linkbtn" onclick="debtDetails('${d.id}')">Платежи и детали →</button></div></div>`).join('')||'<div class="empty">Здесь будут кредиты и другие долги.</div>'}`;if(financeTab==='savings')inner=`<button class="addwide" onclick="savingForm()">＋ Новая цель накопления</button>${data.savings.map(s=>`<div class="card"><div class="row"><div class="iconbox">🐚</div><div class="grow"><h4>${esc(s.title)}</h4><div class="sub">${fmt(s.current)} из ${fmt(s.target)}</div></div><b>${pct(s.current,s.target)}%</b></div><div class="progress"><span style="width:${pct(s.current,s.target)}%"></span></div><button class="linkbtn" onclick="savingAdd('${s.id}')">＋ Пополнить</button></div>`).join('')||'<div class="empty">Создай цель накопления.</div>'}`;return `${head('ФИНАНСОВАЯ ЯСНОСТЬ','Финансы 🌼','Понятная картина без осуждения.') }<div class="stats">${stat(fmt(income),'Доходы')}${stat(fmt(expenses),'Расходы')}${stat(fmt(income-expenses),'Разница')}</div><div class="stats">${stat(fmt(debt),'Остаток долгов')}${stat(fmt(saved),'Накоплено')}${stat(data.savings.length,'Цели накоплений')}</div><div class="pills">${[['transactions','Операции'],['debts','Долги'],['savings','Накопления']].map(([k,v])=>`<button class="pill ${financeTab===k?'active':''}" onclick="financeTab='${k}';render()">${v}</button>`).join('')}</div><div style="margin-top:12px">${inner}</div><div class="notice">Финансовые операции вводятся вручную. Отметка платежа уменьшает остаток долга и сохраняет историю. Банковские операции приложение не выполняет.</div>`}
function transactionForm(){openModal(`<div class="modalhead"><h3>Новая операция</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target);data.transactions.push({id:id(),title:f.get('title'),amount:Number(f.get('amount')),type:f.get('type'),date:f.get('date'),category:f.get('category')});closeModal();save()"><div class="field"><label>Название</label><input name="title" required></div><div class="formgrid"><div class="field"><label>Тип</label><select name="type"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="field"><label>Сумма, ₽</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Дата</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Категория</label><input name="category" placeholder="Продукты, зарплата…"></div></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
function debtForm(){openModal(`<div class="modalhead"><h3>Добавить долг</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target),g=f.get('link').split('::');data.debts.push({id:id(),title:f.get('title'),original:Number(f.get('amount')),balance:Number(f.get('amount')),rate:Number(f.get('rate')||0),payment:Number(f.get('payment')||0),term:f.get('term'),goalId:g[0]||'',subgoalId:g[1]||'',payments:[]});closeModal();save()"><div class="field"><label>Название долга</label><input name="title" required placeholder="Ипотека"></div><div class="formgrid"><div class="field"><label>Начальная сумма, ₽</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Ставка, % годовых</label><input name="rate" type="number" min="0" step=".01"></div><div class="field"><label>Плановый платёж, ₽</label><input name="payment" type="number" min="0"></div><div class="field"><label>Срок / дата окончания</label><input name="term" placeholder="Например, 2032"></div><div class="field full"><label>Связать с подцелью</label><select name="link">${linkOptions()}</select></div></div><button class="primary" style="width:100%">Добавить долг</button></form>`)}
function debtDetails(did){let d=data.debts.find(x=>x.id===did);if(!d)return;openModal(`<div class="modalhead"><h3>${esc(d.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="card"><div class="sub">Текущий остаток</div><div class="money">${fmt(d.balance??d.amount)}</div><div class="sub">Ставка ${d.rate||0}% · ${d.term||'Срок не указан'}</div></div><button class="addwide" onclick="debtPayment('${did}')">＋ Отметить платёж</button><h4>История платежей</h4>${(d.payments||[]).slice().reverse().map(p=>`<div class="task"><div class="grow"><div class="taskname">${dateFmt(p.date)} · ${fmt(p.amount)}</div><div class="tasktime">${esc(p.note||'Платёж')}</div></div></div>`).join('')||'<p class="sub">Платежей пока нет.</p>'}${d.goalId?`<div class="notice">Связано с подцелью «${esc(subName(d.goalId,d.subgoalId))}». Прогресс подцели обновится автоматически.</div>`:''}`)}function debtPayment(did){let d=data.debts.find(x=>x.id===did);openModal(`<div class="modalhead"><h3>Отметить платёж</h3><button class="close" onclick="closeModal()">×</button></div><p class="sub">Остаток сейчас: ${fmt(d.balance??d.amount)}</p><form onsubmit="event.preventDefault();let f=new FormData(event.target),a=Number(f.get('amount'));if(a<=0||a>(d.balance??d.amount)){alert('Проверь сумму платежа');return}d.balance=(d.balance??d.amount)-a;d.payments=d.payments||[];d.payments.push({id:id(),amount:a,date:f.get('date'),note:f.get('note')});data.transactions.push({id:id(),title:'Платёж: '+d.title,amount:a,type:'expense',date:f.get('date'),category:'Погашение долга'});closeModal();save()"><div class="field"><label>Сумма платежа, ₽</label><input name="amount" type="number" min=".01" step=".01" required value="${d.payment||''}"></div><div class="field"><label>Дата</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Примечание</label><input name="note" placeholder="Плановый платёж"></div><button class="primary" style="width:100%">Подтвердить платёж</button></form>`)}
function savingForm(){openModal(`<div class="modalhead"><h3>Цель накопления</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target),g=f.get('link').split('::');data.savings.push({id:id(),title:f.get('title'),current:Number(f.get('current')||0),target:Number(f.get('target')),goalId:g[0]||'',subgoalId:g[1]||''});closeModal();save()"><div class="field"><label>Название</label><input name="title" required></div><div class="formgrid"><div class="field"><label>Уже накоплено, ₽</label><input name="current" type="number" min="0" value="0"></div><div class="field"><label>Цель, ₽</label><input name="target" type="number" min="1" required></div><div class="field full"><label>Связать с подцелью</label><select name="link">${linkOptions()}</select></div></div><button class="primary" style="width:100%">Создать</button></form>`)}function savingAdd(sid){let s=data.savings.find(x=>x.id===sid);openModal(`<div class="modalhead"><h3>Пополнить накопления</h3><button class="close" onclick="closeModal()">×</button></div><p class="sub">${esc(s.title)} · ${fmt(s.current)} из ${fmt(s.target)}</p><form onsubmit="event.preventDefault();let f=new FormData(event.target),a=Number(f.get('amount'));s.current+=a;data.transactions.push({id:id(),title:'Пополнение: '+s.title,amount:a,type:'expense',date:f.get('date'),category:'Накопления'});closeModal();save()"><div class="field"><label>Сумма, ₽</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Дата</label><input name="date" type="date" value="${today()}"></div><button class="primary" style="width:100%">Пополнить</button></form>`)}
function goalForm(gid=''){let g=data.goals.find(x=>x.id===gid)||{};openModal(`<div class="modalhead"><h3>${gid?'Изменить цель':'Новая цель'}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target),p=Number(f.get('progress'));if(gid){g.title=f.get('title');g.progress=p;g.description=f.get('description')}else data.goals.push({id:id(),title:f.get('title'),progress:p,description:f.get('description'),subgoals:[]});closeModal();save()"><div class="field"><label>Название цели</label><input name="title" required value="${esc(g.title||'')}"></div><div class="field"><label>Общий прогресс — вручную, %</label><input name="progress" type="number" min="0" max="100" value="${g.progress||0}"></div><div class="field"><label>Описание</label><textarea name="description">${esc(g.description||'')}</textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}function openGoals(){openModal(`<div class="modalhead"><h3>Мои цели</h3><button class="close" onclick="closeModal()">×</button></div><button class="addwide" onclick="closeModal();goalForm()">＋ Новая цель</button>${data.goals.map(g=>`<div class="task"><div class="grow"><b>${esc(g.title)}</b><div class="sub">${g.progress||0}% · ${(g.subgoals||[]).length} подцелей</div></div><button class="linkbtn" onclick="goalDetails('${g.id}')">Открыть</button></div>`).join('')}`)}function goalDetails(gid){let g=data.goals.find(x=>x.id===gid);if(!g)return;let subs=(g.subgoals||[]).map(s=>`<div class="card"><div class="row"><div class="grow"><h4>${esc(s.title)}</h4><div class="sub">${s.links?.length?'Есть связанные элементы':'Пока нет связей'}</div></div><b>${Number(s.progress)||0}%</b></div><div class="progress"><span style="width:${Number(s.progress)||0}%"></span></div><div class="row" style="justify-content:space-between;margin-top:7px"><button class="linkbtn" onclick="subgoalDetails('${g.id}','${s.id}')">Открыть подцель →</button><button class="smallbtn" onclick="editSubgoal('${g.id}','${s.id}')">Изменить</button></div></div>`).join('');openModal(`<div class="modalhead"><h3>${esc(g.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="card"><div class="row" style="justify-content:space-between"><span class="sub">Общий прогресс · вручную</span><b>${g.progress||0}%</b></div><div class="progress"><span style="width:${g.progress||0}%"></span></div><button class="linkbtn" onclick="manualGoalProgress('${g.id}')">Изменить прогресс</button><p class="sub">${esc(g.description||'')}</p></div><button class="addwide" onclick="subgoalForm('${g.id}')">＋ Добавить подцель</button>${subs||'<div class="empty">Добавь подцели, чтобы разбить большую цель на понятные направления.</div>'}<button class="secondary" style="width:100%;margin-top:7px" onclick="goalForm('${g.id}')">Изменить цель</button><button class="smallbtn" onclick="archiveGoal('${g.id}')">Архивировать цель</button>`)}function manualGoalProgress(gid){let g=data.goals.find(x=>x.id===gid);openModal(`<div class="modalhead"><h3>Прогресс цели</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target);g.progress=Number(f.get('progress'));g.history=g.history||[];g.history.push({date:today(),progress:g.progress,note:f.get('reason')});closeModal();save()"><div class="field"><label>Новый прогресс, %</label><input name="progress" type="number" min="0" max="100" value="${g.progress||0}" required></div><div class="field"><label>Причина изменения</label><textarea name="reason" required placeholder="Почему ты оцениваешь прогресс именно так?"></textarea></div><button class="primary" style="width:100%">Подтвердить изменение</button></form>`)}function subgoalForm(gid,sid=''){let g=data.goals.find(x=>x.id===gid),s=g.subgoals.find(x=>x.id===sid)||{};openModal(`<div class="modalhead"><h3>${sid?'Изменить подцель':'Новая подцель'}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target);if(sid){s.title=f.get('title');s.progress=Number(f.get('progress'))}else g.subgoals.push({id:id(),title:f.get('title'),progress:Number(f.get('progress')||0),links:[],history:[]});closeModal();save()"><div class="field"><label>Название подцели</label><input name="title" required value="${esc(s.title||'')}"></div><div class="field"><label>Прогресс, %</label><input name="progress" type="number" min="0" max="100" value="${s.progress||0}"></div><button class="primary" style="width:100%">Сохранить подцель</button></form>`)}function editSubgoal(gid,sid){subgoalForm(gid,sid)}function subProgress(gid,sid){let s=data.goals.find(x=>x.id===gid)?.subgoals?.find(x=>x.id===sid);if(!s)return 0;if(s.manualOverride)return Number(s.progress)||0;let ds=data.debts.filter(x=>x.goalId===gid&&x.subgoalId===sid);if(ds.length)return Math.round(ds.reduce((n,d)=>n+pct((d.original||d.amount)-(d.balance??d.amount),d.original||d.amount),0)/ds.length);let ss=data.savings.filter(x=>x.goalId===gid&&x.subgoalId===sid);if(ss.length)return Math.round(ss.reduce((n,x)=>n+pct(x.current,x.target),0)/ss.length);let ts=data.tasks.filter(x=>x.goalId===gid&&x.subgoalId===sid);if(ts.length)return pct(ts.filter(x=>x.done).length,ts.length);let hs=data.habits.filter(x=>x.goalId===gid&&x.subgoalId===sid);if(hs.length){let total=0,done=0;hs.forEach(h=>{let days=h.schedule||[0,1,2,3,4,5,6];for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);if(days.includes(d.getDay())){total++;if(h.logs?.[fmtDate(d)])done++}}});return pct(done,total)}return Number(s.progress)||0}
function subgoalDetails(gid,sid){let g=data.goals.find(x=>x.id===gid),s=g.subgoals.find(x=>x.id===sid);if(!s)return;let currentProgress=subProgress(gid,sid);let related=[...data.tasks.filter(x=>x.goalId===gid&&x.subgoalId===sid).map(x=>({type:'Задача',title:x.title,meta:x.date})),...data.habits.filter(x=>x.goalId===gid&&x.subgoalId===sid).map(x=>({type:'Привычка',title:x.title,meta:'По расписанию'})),...data.debts.filter(x=>x.goalId===gid&&x.subgoalId===sid).map(x=>({type:'Долг',title:x.title,meta:fmt(x.balance??x.amount)})),...data.savings.filter(x=>x.goalId===gid&&x.subgoalId===sid).map(x=>({type:'Накопление',title:x.title,meta:fmt(x.current)+' / '+fmt(x.target)}))];openModal(`<div class="modalhead"><h3>${esc(s.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="card"><div class="row" style="justify-content:space-between"><span class="sub">Прогресс подцели</span><b>${currentProgress}%</b></div><div class="progress"><span style="width:${currentProgress}%"></span></div><div class="sub">${s.manualOverride?'Ручная корректировка':'Расчёт по связанным элементам'}</div><button class="linkbtn" onclick="manualSubProgress('${gid}','${sid}')">Изменить вручную</button></div><h4>Связанные элементы</h4>${related.map(x=>`<div class="task"><div class="grow"><div class="taskname">${esc(x.title)}</div><div class="tasktime">${x.type} · ${esc(x.meta)}</div></div></div>`).join('')||'<p class="sub">Пока нет связанных элементов.</p>'}<div class="notice">Добавляй связь с подцелью при создании задачи, привычки, долга или накопления. Элемент будет отображаться здесь без дублирования.</div><button class="secondary" style="width:100%" onclick="editSubgoal('${gid}','${sid}')">Изменить подцель</button>`)}function manualSubProgress(gid,sid){let g=data.goals.find(x=>x.id===gid),s=g.subgoals.find(x=>x.id===sid);openModal(`<div class="modalhead"><h3>Корректировка подцели</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice">Подцель связана с другими разделами. Ручное изменение не отменяет исходные финансовые или другие данные. Укажи причину корректировки.</div><form onsubmit="event.preventDefault();let f=new FormData(event.target);if(!confirm('Подтвердить ручную корректировку прогресса?'))return;s.progress=Number(f.get('progress'));s.manualOverride=true;s.history=s.history||[];s.history.push({date:today(),progress:s.progress,reason:f.get('reason')});closeModal();save()"><div class="field"><label>Новый прогресс, %</label><input name="progress" type="number" min="0" max="100" value="${s.progress||0}" required></div><div class="field"><label>Объяснение причины</label><textarea name="reason" required></textarea></div><button class="primary" style="width:100%">Подтвердить корректировку</button></form>`)}function archiveGoal(gid){if(confirm('Переместить цель в архив?')){let g=data.goals.find(x=>x.id===gid);g.archived=true;closeModal();save()}}
function aiView(){return `${head('ТВОЙ ИНТЕЛЛЕКТУАЛЬНЫЙ ПОМОЩНИК','AI-помощник ✨','Один помощник для целей, привычек, задач и финансов.') }<div class="card"><div class="iconbox">✧</div><h3>Здесь будет твой личный AI</h3><p class="sub">Он сможет анализировать выбранные тобой разделы, помогать планировать неделю, замечать риски и предлагать следующие шаги.</p><div class="notice">AI-интеграция пока не подключена. Для неё понадобится защищённый серверный компонент и отдельное согласие на доступ к данным. Ключ API нельзя хранить в открытом коде приложения.</div><button class="secondary" onclick="openSettings()">Настройки приватности и данных</button></div><div class="card"><b>Что предусмотрим</b><div class="task">✓ Контекст всех разрешённых разделов</div><div class="task">✓ Недельные планы и обзоры</div><div class="task">✓ Финансовые сценарии с расчётами и допущениями</div><div class="task">✓ Рекомендации по обучению, спорту и проектам</div><div class="task">✓ Никаких действий с деньгами без отдельного подтверждения</div></div>`}
function diaryView(){return `${head('ЛИЧНОЕ ПРОСТРАНСТВО','Дневник 📖','Мысли, заметки, идеи и события.') }<button class="addwide" onclick="diaryForm()">＋ Новая запись</button>${data.diary.slice().reverse().map(d=>`<div class="card"><div class="row"><div class="grow"><h4>${esc(d.title||'Запись без названия')}</h4><div class="sub">${dateFmt(d.date)} ${d.mood||''}</div></div><button class="smallbtn" onclick="diaryForm('${d.id}')">Изменить</button></div><p class="sub" style="white-space:pre-wrap">${esc(d.text)}</p></div>`).join('')||'<div class="empty">Здесь можно сохранять мысли и идеи.</div>'}`}function diaryForm(did=''){let d=data.diary.find(x=>x.id===did)||{};openModal(`<div class="modalhead"><h3>${did?'Редактировать запись':'Новая запись'}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();let f=new FormData(event.target),x={id:'${did||''}'||id(),title:f.get('title'),date:f.get('date'),mood:f.get('mood'),text:f.get('text')},i=data.diary.findIndex(z=>z.id==='${did}');if(i>=0)data.diary[i]=x;else data.diary.push(x);closeModal();save()"><div class="field"><label>Заголовок</label><input name="title" value="${esc(d.title||'')}"></div><div class="formgrid"><div class="field"><label>Дата</label><input name="date" type="date" value="${d.date||today()}"></div><div class="field"><label>Настроение</label><select name="mood"><option>${d.mood||'🌿 Спокойно'}</option><option>😊 Хорошо</option><option>🌿 Спокойно</option><option>😐 Нейтрально</option><option>🌧️ Сложный день</option></select></div></div><div class="field"><label>Запись</label><textarea name="text" required>${esc(d.text||'')}</textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}function analyticsView(){let total=data.tasks.length,done=data.tasks.filter(t=>t.done).length,habitLogs=data.habits.reduce((n,h)=>n+Object.values(h.logs||{}).filter(Boolean).length,0),income=data.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),expense=data.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);return `${head('ОБЩАЯ КАРТИНА','Аналитика','Смотри на динамику, а не только на отдельные дни.') }<div class="stats">${stat(total?pct(done,total)+'%':'—','Задачи выполнены')}${stat(habitLogs,'Отметки привычек')}${stat(data.goals.filter(g=>g.progress===100).length,'Завершённые цели')}</div><div class="card"><h4>Задачи</h4><div class="sub">${done} выполнено из ${total}</div><div class="progress"><span style="width:${pct(done,total)}%"></span></div></div><div class="card"><h4>Финансы</h4><div class="row" style="justify-content:space-between"><span class="sub">Доходы</span><b class="positive">${fmt(income)}</b></div><div class="row" style="justify-content:space-between"><span class="sub">Расходы</span><b class="negative">${fmt(expense)}</b></div><div class="row" style="justify-content:space-between"><span class="sub">Разница</span><b>${fmt(income-expense)}</b></div></div><div class="card"><h4>Цели</h4>${data.goals.map(g=>`<div class="task"><div class="grow">${esc(g.title)}<div class="progress"><span style="width:${g.progress||0}%"></span></div></div><b>${g.progress||0}%</b></div>`).join('')||'<p class="sub">Добавь цель, чтобы отслеживать динамику.</p>'}</div>`}function goSpecial(p){page=p;render()}function menuPage(p){closeModal();go(p)}
function openMenu(){openModal(`<div class="modalhead"><h3>Ещё в «Моём плане»</h3><button class="close" onclick="closeModal()">×</button></div><div class="menugrid"><button class="menuitem" onclick="menuPage('diary')"><span>📖</span><b>Дневник</b><div class="sub">Мысли и идеи</div></button><button class="menuitem" onclick="menuPage('analytics')"><span>▥</span><b>Аналитика</b><div class="sub">Общая динамика</div></button><button class="menuitem" onclick="openSettings()"><span>⚙</span><b>Настройки</b><div class="sub">Данные и резервные копии</div></button><button class="menuitem" onclick="exportData()"><span>⇩</span><b>Экспорт</b><div class="sub">Сохранить копию</div></button></div>`)}
function openSettings(){openModal(`<div class="modalhead"><h3>Настройки и данные</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Локальное хранение.</b> Сейчас данные находятся в браузере этого устройства. Облачная синхронизация ещё не подключена. Перед обновлением или переносом сделай резервную копию.</div><button class="secondary" style="width:100%;margin:5px 0" onclick="exportData()">Экспортировать резервную копию JSON</button><label class="secondary" style="display:block;text-align:center;margin:5px 0;cursor:pointer">Импортировать резервную копию<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label><button class="secondary" style="width:100%;margin:5px 0" onclick="showCloudSetup()">Облачная синхронизация</button><p class="sub">Версия 2.0 · Мой план 🌵 · AI пока не подключён</p>`)}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moy-plan-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.goals||!x.tasks)throw Error();if(confirm('Заменить текущие данные импортированной копией?')){data={...fresh(),...x};save();closeModal()}}catch(err){alert('Не удалось прочитать резервную копию.')}};r.readAsText(f)}function showCloudSetup(){openModal(`<div class="modalhead"><h3>Облачная синхронизация</h3><button class="close" onclick="closeModal()">×</button></div><p>Для синхронизации iPhone и MacBook подключим Firebase Authentication и Firestore с отдельными правилами доступа для каждого пользователя. Это следующий технический этап.</p><p class="sub">До настройки облака данные не синхронизируются между устройствами автоматически.</p>`)}function removeItem(k,i){if(confirm('Удалить запись?')){data[k]=data[k].filter(x=>x.id!==i);save()}}
function closeModal(){document.getElementById('modalback').classList.remove('show')}function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
