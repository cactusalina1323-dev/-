<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1ed">
<meta name="description" content="Личный планировщик: цели, привычки, задачи и финансы">
<link rel="manifest" href="manifest.json">
<title>Мой план</title>
<style>
:root{--bg:#f8f4f1;--card:#fffdfb;--ink:#302e2c;--muted:#817a76;--line:#ece3de;--rose:#e8b9b5;--rose2:#f5e1de;--green:#5b927d;--green2:#e1eee7;--gold:#d7ae75;--shadow:0 8px 28px #6c4b3a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#f8f4f1ed;backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid #ece3de80}
.head{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:auto}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:15px;background:var(--rose2);display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.sync{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 10px;font-size:11px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:18px 16px 24px}.greeting{margin:8px 2px 20px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}.greeting h2{font-size:27px;line-height:1.15;margin:7px 0}.greeting p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 12px;box-shadow:var(--shadow)}.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:11px;color:var(--muted);margin-top:4px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.sectionhead h3{margin:0;font-size:17px}.linkbtn{border:0;background:transparent;color:var(--green);font-size:13px;padding:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.iconbox{width:42px;height:42px;border-radius:14px;background:var(--rose2);display:grid;place-items:center;font-size:20px;flex-shrink:0}.card h4{margin:0 0 5px;font-size:14px}.sub{color:var(--muted);font-size:12px}.progress{height:6px;background:#eee7e2;border-radius:10px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--green);border-radius:10px}.check{width:23px;height:23px;accent-color:var(--green);flex-shrink:0}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0e9e5}.task:last-child{border:0}.task.done .taskname{text-decoration:line-through;color:#9b9692}.taskname{font-size:14px}.tasktime{font-size:11px;color:var(--muted);margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fffdfbf0;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{display:flex;width:min(760px,100%);justify-content:space-around}.navbtn{border:0;background:transparent;color:#8c8580;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;font-size:10px;min-width:52px}.navbtn span:first-child{font-size:20px}.navbtn.active{color:var(--green);font-weight:700}
.primary{border:0;background:var(--green);color:white;border-radius:14px;padding:12px 16px;font-weight:600}.secondary{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 13px;color:var(--ink)}.addwide{width:100%;border:1px dashed #d8c9c1;background:#fffaf7;color:#6f887d;border-radius:15px;padding:13px;margin:5px 0 12px}
.pills{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 12px;color:var(--muted);font-size:12px}.pill.active{background:var(--green2);border-color:#c9dfd3;color:#396e5a}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdfb;color:var(--ink);outline-color:var(--green)}.field.full{grid-column:1/-1}.empty{text-align:center;padding:28px 15px;color:var(--muted);font-size:13px}.empty .big{font-size:30px;margin-bottom:8px}.money{font-size:24px;font-weight:700}.positive{color:var(--green)}.negative{color:#c06e69}.habitdays{display:flex;gap:5px;margin-top:12px}.daydot{flex:1;border:0;border-radius:10px;padding:8px 0;background:#f1ece8;color:#9b938e;font-size:11px}.daydot.yes{background:var(--green2);color:#39715b}.daydot.today{outline:1px solid var(--green)}
.modalback{position:fixed;inset:0;z-index:20;background:#302e2c66;display:none;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));width:min(760px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{border:0;background:var(--rose2);border-radius:50%;width:34px;height:34px;font-size:19px}
.notice{background:#f5e9d9;border-radius:14px;padding:12px;font-size:12px;color:#735c43;line-height:1.45;margin-bottom:12px}.smallbtn{border:0;background:transparent;color:#a36d68;padding:6px;font-size:12px}
@media(min-width:620px){main{padding:24px}.modalback{align-items:center}.modal{border-radius:24px}.stats{gap:13px}.stat{padding:17px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">🌵</div><div><h1>Мой план</h1><p>Твой план — твоя свобода</p></div></div><button class="sync" id="syncStatus" onclick="openSettings()">● На устройстве</button></div></header>
<main id="app"></main>
<nav><div class="navinner" id="nav">
<button class="navbtn active" data-tab="home"><span>⌂</span><span>Главная</span></button>
<button class="navbtn" data-tab="goals"><span>◎</span><span>Цели</span></button>
<button class="navbtn" data-tab="habits"><span>◷</span><span>Привычки</span></button>
<button class="navbtn" data-tab="tasks"><span>☷</span><span>Задачи</span></button>
<button class="navbtn" data-tab="finance"><span>₽</span><span>Финансы</span></button>
</div></nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const KEY='moy-plan-v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const starter=()=>({goals:[
{id:uid(),title:'Переезд',category:'Личная жизнь',deadline:'2027-06-01',color:'🏡',subs:['Накопить 10 000 ₽ в месяц','Закрыть ипотеку','Выучить английский','Получить водительские права'],done:[]},
{id:uid(),title:'Доход 300 000 ₽',category:'Финансы',deadline:'2027-12-31',color:'💸',subs:['Развить профессиональные навыки','Создать дополнительный источник дохода'],done:[]},
{id:uid(),title:'Закрыть долги',category:'Финансы',deadline:'2027-03-01',color:'🌱',subs:['Составить план погашения','Вносить платежи по графику'],done:[]},
{id:uid(),title:'Купить недвижимость',category:'Финансы',deadline:'2028-12-31',color:'🏠',subs:['Изучить рынок','Сформировать первоначальный взнос'],done:[]}
],habits:[
{id:uid(),title:'Английский — 30 минут',emoji:'📚',logs:{}},
{id:uid(),title:'Спорт — 30 минут',emoji:'🌿',logs:{}},
{id:uid(),title:'Трейдинг — 30 минут',emoji:'📈',logs:{}},
{id:uid(),title:'Создание контента',emoji:'🎬',logs:{}}
],tasks:[
{id:uid(),title:'Заняться английским',date:today(),time:'10:00',done:false},
{id:uid(),title:'Спорт',date:today(),time:'12:00',done:false},
{id:uid(),title:'Продвинуться по одной из целей',date:today(),time:'18:00',done:false}
],transactions:[],debts:[],savings:[],settings:{cloud:false}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||starter()}catch(e){data=starter()}
let tab='home',taskFilter='today',financeTab='transactions',calendarDate=today();
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function fmt(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽'}
function dateFmt(s){if(!s)return 'Без срока';return new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}
function pct(a,b){return b?Math.round(a/b*100):0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(t){tab=t;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function field(label,name,placeholder='',type='text',value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`}
function formStart(title,body,submit){openModal(`<div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="${submit}(event)">${body}<button class="primary" style="width:100%;margin-top:8px">Сохранить</button></form>`)}
function addTask(){formStart('Новая задача',`<div class="field"><label>Название</label><input name="title" required placeholder="Что нужно сделать?"></div><div class="formgrid">${field('Дата','date','','date',calendarDate||today())}${field('Время','time','','time','12:00')}</div><div class="field"><label>Связать с целью (необязательно)</label><select name="goal"><option value="">Без цели</option>${data.goals.map(g=>`<option value="${g.id}">${esc(g.title)}</option>`).join('')}</select></div>`,`submitTask`)}
function submitTask(e){e.preventDefault();let f=new FormData(e.target);data.tasks.push({id:uid(),title:f.get('title'),date:f.get('date'),time:f.get('time'),goal:f.get('goal'),done:false});closeModal();save()}
function addGoal(){formStart('Новая цель',`<div class="field"><label>Название цели</label><input name="title" required placeholder="Например, переезд"></div><div class="formgrid">${field('Категория','category','Личная жизнь')}${field('Срок','deadline','','date')}</div><div class="field"><label>Эмодзи</label><input name="emoji" value="🎯" maxlength="4"></div><div class="field"><label>Подцели (каждая с новой строки)</label><textarea name="subs" rows="4" placeholder="Первый шаг&#10;Второй шаг"></textarea></div>`,`submitGoal`)}
function submitGoal(e){e.preventDefault();let f=new FormData(e.target);data.goals.push({id:uid(),title:f.get('title'),category:f.get('category')||'Общее',deadline:f.get('deadline'),color:f.get('emoji')||'🎯',subs:f.get('subs').split('\n').map(x=>x.trim()).filter(Boolean),done:[]});closeModal();save()}
function addHabit(){formStart('Новая привычка',`<div class="field"><label>Название</label><input name="title" required placeholder="Например, читать 20 минут"></div><div class="field"><label>Эмодзи</label><input name="emoji" value="🌱" maxlength="4"></div>`,`submitHabit`)}
function submitHabit(e){e.preventDefault();let f=new FormData(e.target);data.habits.push({id:uid(),title:f.get('title'),emoji:f.get('emoji')||'🌱',logs:{}});closeModal();save()}
function addTransaction(){formStart('Новая операция',`<div class="field"><label>Тип операции</label><select name="type"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="field"><label>Сумма, ₽</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0"></div><div class="field"><label>Категория / описание</label><input name="title" required placeholder="Например, продукты"></div><div class="field"><label>Дата</label><input name="date" type="date" value="${today()}" required></div>`,`submitTransaction`)}
function submitTransaction(e){e.preventDefault();let f=new FormData(e.target);data.transactions.unshift({id:uid(),type:f.get('type'),amount:Number(f.get('amount')),title:f.get('title'),date:f.get('date')});closeModal();save()}
function addDebt(){formStart('Добавить долг',`<div class="field"><label>Название</label><input name="title" required placeholder="Кредит, карта или другой долг"></div><div class="field"><label>Остаток долга, ₽</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Ежемесячный платёж, ₽ (необязательно)</label><input name="payment" type="number" min="0" step=".01"></div>`,`submitDebt`)}
function submitDebt(e){e.preventDefault();let f=new FormData(e.target);data.debts.push({id:uid(),title:f.get('title'),amount:+f.get('amount'),payment:+f.get('payment')||0});closeModal();save()}
function addSaving(){formStart('Цель накопления',`<div class="field"><label>На что копим?</label><input name="title" required placeholder="Подушка безопасности"></div><div class="formgrid">${field('Целевая сумма, ₽','target','','number')}${field('Уже накоплено, ₽','current','','number','0')}</div>`,`submitSaving`)}
function submitSaving(e){e.preventDefault();let f=new FormData(e.target);data.savings.push({id:uid(),title:f.get('title'),target:+f.get('target'),current:+f.get('current')||0});closeModal();save()}
function taskToggle(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}
function habitToggle(id,date=today()){let h=data.habits.find(x=>x.id===id);if(h){h.logs=h.logs||{};h.logs[date]=!h.logs[date]}save()}
function subToggle(gid,i){let g=data.goals.find(x=>x.id===gid);if(!g)return;g.done=g.done||[];g.done.includes(i)?g.done=g.done.filter(x=>x!==i):g.done.push(i);save()}
function deleteItem(type,id){if(!confirm('Удалить эту запись?'))return;data[type]=data[type].filter(x=>x.id!==id);save()}
function render(){let app=document.getElementById('app');if(tab==='home')app.innerHTML=home();if(tab==='goals')app.innerHTML=goalsView();if(tab==='habits')app.innerHTML=habitsView();if(tab==='tasks')app.innerHTML=tasksView();if(tab==='finance')app.innerHTML=financeView()}
function home(){let todayTasks=data.tasks.filter(t=>t.date===today()),done=todayTasks.filter(t=>t.done).length;let allDone=data.habits.filter(h=>h.logs&&h.logs[today()]).length;return `<div class="greeting"><div class="eyebrow">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div><h2>Привет! 🌿</h2><p>Маленькие шаги тоже ведут к большим целям.</p></div><div class="stats"><div class="stat"><div class="n">${done}/${todayTasks.length}</div><div class="l">Задач сегодня</div></div><div class="stat"><div class="n">${allDone}/${data.habits.length}</div><div class="l">Привычек сегодня</div></div><div class="stat"><div class="n">${data.goals.length}</div><div class="l">Активных целей</div></div></div><div class="sectionhead"><h3>План на сегодня</h3><button class="linkbtn" onclick="setTab('tasks')">Все задачи →</button></div><div class="card">${todayTasks.length?todayTasks.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(taskRow).join(''):`<div class="empty"><div class="big">☀️</div>Пока нет задач на сегодня</div>`}</div><button class="addwide" onclick="addTask()">＋ Добавить задачу</button><div class="sectionhead"><h3>Мои цели</h3><button class="linkbtn" onclick="setTab('goals')">Все цели →</button></div>${data.goals.slice(0,3).map(goalCard).join('')||'<div class="empty">Добавь первую цель — начнём движение.</div>'}<div class="sectionhead"><h3>Привычки</h3><button class="linkbtn" onclick="setTab('habits')">Отметить →</button></div><div class="card">${data.habits.slice(0,4).map(h=>`<div class="task"><input class="check" type="checkbox" ${h.logs&&h.logs[today()]?'checked':''} onchange="habitToggle('${h.id}')"><div class="grow"><div class="taskname">${h.emoji} ${esc(h.title)}</div></div></div>`).join('')||'<div class="empty">Добавь привычку</div>'}</div>`}
function taskRow(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="taskToggle('${t.id}')"><div class="grow"><div class="taskname">${esc(t.title)}</div><div class="tasktime">${esc(t.time||'Без времени')}${t.goal?' · '+esc((data.goals.find(g=>g.id===t.goal)||{}).title||'Цель'):''}</div></div><button class="smallbtn" onclick="deleteItem('tasks','${t.id}')">Удалить</button></div>`}
function goalCard(g){let n=(g.done||[]).length,total=g.subs.length,p= pct(n,total);return `<div class="card"><div class="row"><div class="iconbox">${g.color||'🎯'}</div><div class="grow"><h4>${esc(g.title)}</h4><div class="sub">${esc(g.category||'Общее')} · ${n} из ${total} шагов</div></div><div class="sub">${p}%</div></div><div class="progress"><span style="width:${p}%"></span></div><div class="sub" style="margin-top:9px">Срок: ${dateFmt(g.deadline)}</div><button class="linkbtn" style="padding-left:0" onclick="goalDetails('${g.id}')">Открыть цель →</button></div>`}
function goalDetails(id){let g=data.goals.find(x=>x.id===id);if(!g)return;openModal(`<div class="modalhead"><h3>${g.color} ${esc(g.title)}</h3><button class="close" onclick="closeModal()">×</button></div><p class="sub">${esc(g.category||'Общее')} · срок ${dateFmt(g.deadline)}</p><div class="sectionhead"><h3>Подцели и шаги</h3></div>${g.subs.map((s,i)=>`<div class="task ${(g.done||[]).includes(i)?'done':''}"><input class="check" type="checkbox" ${(g.done||[]).includes(i)?'checked':''} onchange="subToggle('${g.id}',${i});goalDetails('${g.id}')"><div class="grow taskname">${esc(s)}</div></div>`).join('')}<button class="secondary" style="margin-top:14px" onclick="deleteItem('goals','${g.id}');closeModal()">Удалить цель</button>`)}
function goalsView(){return `<div class="greeting"><div class="eyebrow">ТВОЁ БУДУЩЕЕ</div><h2>Цели 🌷</h2><p>Большие перемены начинаются с конкретных шагов.</p></div><button class="addwide" onclick="addGoal()">＋ Добавить цель</button>${data.goals.map(goalCard).join('')||'<div class="empty">Пока нет целей. Добавь первую!</div>'}`}
function streak(h){let n=0,d=new Date();for(let i=0;i<366;i++){let s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(h.logs&&h.logs[s])n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function habitsView(){let dates=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)}return `<div class="greeting"><div class="eyebrow">МАЛЕНЬКИЕ ШАГИ КАЖДЫЙ ДЕНЬ</div><h2>Привычки 🌱</h2><p>Регулярность важнее идеальности.</p></div><button class="addwide" onclick="addHabit()">＋ Добавить привычку</button>${data.habits.map(h=>`<div class="card"><div class="row"><div class="iconbox">${h.emoji}</div><div class="grow"><h4>${esc(h.title)}</h4><div class="sub">🔥 Серия: ${streak(h)} дн.</div></div><button class="smallbtn" onclick="deleteItem('habits','${h.id}')">Удалить</button></div><div class="habitdays">${dates.map((d,i)=>`<button class="daydot ${(h.logs&&h.logs[d]?'yes ':'')+(d===today()?'today':'')}" onclick="habitToggle('${h.id}','${d}')">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][((new Date(d+'T12:00:00').getDay()+6)%7)]}<br>${d.slice(-2)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">Добавь привычку, которую хочешь закрепить.</div>'}`}
function tasksView(){let tasks=data.tasks.filter(t=>taskFilter==='all'||(taskFilter==='today'?t.date===today():taskFilter==='upcoming'?t.date>today():t.date===calendarDate)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="greeting"><div class="eyebrow">ТВОЙ СПОКОЙНЫЙ ПЛАН</div><h2>Задачи и календарь</h2><p>Записывай дела, чтобы освободить голову.</p></div><button class="addwide" onclick="addTask()">＋ Добавить задачу</button><div class="pills"><button class="pill ${taskFilter==='today'?'active':''}" onclick="taskFilter='today';render()">Сегодня</button><button class="pill ${taskFilter==='upcoming'?'active':''}" onclick="taskFilter='upcoming';render()">Предстоящие</button><button class="pill ${taskFilter==='all'?'active':''}" onclick="taskFilter='all';render()">Все задачи</button><button class="pill ${taskFilter==='date'?'active':''}" onclick="taskFilter='date';render()">По дате</button></div>${taskFilter==='date'?`<div class="field" style="margin-top:12px"><label>Выбери дату</label><input type="date" value="${calendarDate}" onchange="calendarDate=this.value;render()"></div>`:''}<div class="card" style="margin-top:12px">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty"><div class="big">🗓️</div>Задач не найдено. Можно выдохнуть или добавить новое дело.</div>'}</div>`}
function financeView(){let income=data.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expenses=data.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),debt=data.debts.reduce((s,d)=>s+d.amount,0),saved=data.savings.reduce((s,x)=>s+x.current,0);let inner='';if(financeTab==='transactions')inner=`<button class="addwide" onclick="addTransaction()">＋ Добавить операцию</button><div class="card">${data.transactions.length?data.transactions.map(t=>`<div class="task"><div class="iconbox" style="background:${t.type==='income'?'var(--green2)':'var(--rose2)'}">${t.type==='income'?'↙':'↗'}</div><div class="grow"><div class="taskname">${esc(t.title)}</div><div class="tasktime">${dateFmt(t.date)}</div></div><strong class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</strong><button class="smallbtn" onclick="deleteItem('transactions','${t.id}')">×</button></div>`).join(''):'<div class="empty">Добавь доходы и расходы, чтобы видеть картину.</div>'}</div>`;
if(financeTab==='debts')inner=`<button class="addwide" onclick="addDebt()">＋ Добавить долг</button>${data.debts.map(d=>`<div class="card"><div class="row"><div class="iconbox">💳</div><div class="grow"><h4>${esc(d.title)}</h4><div class="sub">Платёж в месяц: ${fmt(d.payment)}</div></div><strong class="negative">${fmt(d.amount)}</strong></div><button class="smallbtn" onclick="deleteItem('debts','${d.id}')">Удалить</button></div>`).join('')||'<div class="empty">Здесь будут кредиты, кредитные карты и другие долги.</div>'}`;
if(financeTab==='savings')inner=`<button class="addwide" onclick="addSaving()">＋ Новая цель накопления</button>${data.savings.map(s=>`<div class="card"><div class="row"><div class="iconbox">🐚</div><div class="grow"><h4>${esc(s.title)}</h4><div class="sub">${fmt(s.current)} из ${fmt(s.target)}</div></div><strong>${pct(s.current,s.target)}%</strong></div><div class="progress"><span style="width:${Math.min(100,pct(s.current,s.target))}%"></span></div><button class="linkbtn" onclick="changeSaving('${s.id}')">＋ Пополнить</button><button class="smallbtn" onclick="deleteItem('savings','${s.id}')">Удалить</button></div>`).join('')||'<div class="empty">Создай цель накопления — например, финансовую подушку.</div>'}`;
return `<div class="greeting"><div class="eyebrow">ФИНАНСОВАЯ ЯСНОСТЬ</div><h2>Финансы 🌼</h2><p>Без осуждения — просто понятная картина.</p></div><div class="stats"><div class="stat"><div class="n positive">${fmt(income)}</div><div class="l">Доходы всего</div></div><div class="stat"><div class="n negative">${fmt(expenses)}</div><div class="l">Расходы всего</div></div><div class="stat"><div class="n">${fmt(income-expenses)}</div><div class="l">Разница</div></div></div><div class="stats"><div class="stat"><div class="n">${fmt(debt)}</div><div class="l">Остаток долгов</div></div><div class="stat"><div class="n">${fmt(saved)}</div><div class="l">Накоплено</div></div><div class="stat"><div class="n">${data.savings.length}</div><div class="l">Целей накопления</div></div></div><div class="pills"><button class="pill ${financeTab==='transactions'?'active':''}" onclick="financeTab='transactions';render()">Операции</button><button class="pill ${financeTab==='debts'?'active':''}" onclick="financeTab='debts';render()">Долги</button><button class="pill ${financeTab==='savings'?'active':''}" onclick="financeTab='savings';render()">Накопления</button></div><div style="margin-top:14px">${inner}</div><div class="notice">Финансовые данные вводятся вручную и хранятся в приложении. Это личный планировщик, а не банковский сервис.</div>`}
function changeSaving(id){let s=data.savings.find(x=>x.id===id);if(!s)return;openModal(`<div class="modalhead"><h3>Пополнить накопления</h3><button class="close" onclick="closeModal()">×</button></div><p>${esc(s.title)} · сейчас ${fmt(s.current)}</p><form onsubmit="event.preventDefault();let a=Number(new FormData(event.target).get('amount'));if(a>0){s.current+=a;closeModal();save()}"><div class="field"><label>Сумма пополнения, ₽</label><input name="amount" type="number" min=".01" step=".01" required></div><button class="primary" style="width:100%">Пополнить</button></form>`)}
function openSettings(){openModal(`<div class="modalhead"><h3>Настройки и синхронизация</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Сейчас:</b> данные сохраняются на этом устройстве. Чтобы синхронизировать iPhone и MacBook, разверни приложение на HTTPS-хостинге и подключи Firebase по инструкции в README.</div><p class="sub">Можно экспортировать резервную копию и импортировать её на другом устройстве.</p><button class="secondary" style="width:100%;margin:6px 0" onclick="exportData()">Экспортировать резервную копию JSON</button><label class="secondary" style="display:block;text-align:center;margin:6px 0;cursor:pointer">Импортировать резервную копию<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label><button class="secondary" style="width:100%;margin:6px 0" onclick="showCloudSetup()">Настроить облачную синхронизацию</button><p class="sub" style="margin-top:16px">Версия 1.0 · Мой план 🌵</p>`)}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moy-plan-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.goals||!x.tasks)throw Error();if(confirm('Заменить текущие данные импортированной копией?')){data=x;save();closeModal()}}catch(err){alert('Не удалось прочитать резервную копию.')}};r.readAsText(f)}
function showCloudSetup(){closeModal();openModal(`<div class="modalhead"><h3>Облачная синхронизация</h3><button class="close" onclick="closeModal()">×</button></div><p>Для безопасной синхронизации нужна личная база данных. В комплекте проекта есть пошаговая инструкция для Firebase.</p><ol style="line-height:1.7;padding-left:22px"><li>Создать проект Firebase.</li><li>Включить анонимную аутентификацию и Firestore.</li><li>Опубликовать приложение на HTTPS.</li><li>Добавить конфигурацию и правила доступа из README.</li></ol><p class="sub">Эта сборка пока не отправляет данные в облако автоматически; не вводи конфиденциальные данные, рассчитывая на облачную защиту, до завершения настройки.</p><button class="primary" style="width:100%" onclick="closeModal()">Понятно</button>`)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
